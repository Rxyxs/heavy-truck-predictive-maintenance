<style>

  .tile .n { font-size: 2rem; font-weight: 650; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tile .l { font-size: 0.85rem; color: var(--ink-2); margin-top: 4px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 14px 12px; margin: 18px 0; position: relative; }
  .card h3 { margin: 0 0 4px; color: var(--ink); font-size: 1rem; }
  .sub { font-size: 0.85rem; color: var(--ink-2); margin: 0 0 10px; max-width: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 6px; align-items: center; }

  input[type=range] { width: 100%; accent-color: var(--accent); }
  .ticks { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--ink-2); margin-top: 2px; }
  .plot { position: relative; }
  .plot svg { width: 100%; height: auto; display: block; touch-action: pan-y; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 0.82rem; line-height: 1.45; box-shadow: 0 4px 14px rgba(0,0,0,.14); z-index: 5; min-width: 170px; transform: translate(-50%, 0); white-space: nowrap; }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .sw.dash { background: none !important; border-top: 3px dashed; height: 0; width: 14px; border-radius: 0; vertical-align: 2px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.85rem; margin-top: 6px; }
  .result { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 12px 0 4px; }
  .result div { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
  .result b { display: block; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .result span { font-size: 0.8rem; color: var(--ink-2); }
  .good b { color: var(--s3); } .bad b { color: var(--s2); }
  .tablewrap { overflow: auto; margin: 8px 0; border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 0.86rem; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--ink-2); font-weight: 600; background: var(--surface); }
  td.diag { color: var(--ink-2); } td.row0 { background: var(--band); }
  td.over { color: var(--s2); font-weight: 650; }
  .fine { font-size: 0.85rem; color: var(--ink-2); }
  figure { margin: 22px 0; }
  figure img { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 9px; background: #fff; }
  figcaption { font-size: 0.85rem; color: var(--ink-2); margin-top: 8px; max-width: 72ch; }
  ul { padding-left: 20px; max-width: 72ch; } li { margin: 6px 0; }
  footer { margin-top: 64px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--ink-2); font-size: 0.85rem; }
  footer a { color: var(--ink-2); }
  @media (max-width: 560px) { .wrap { padding: 0 12px 72px; } .tile .n { font-size: 1.7rem; } }

const loc = () => (lang === "es" ? "es-CL" : "en-US");
const num = (v, d = 0) => v.toLocaleString(loc(), { minimumFractionDigits: d, maximumFractionDigits: d });
const fill = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => (k in o ? o[k] : ""));
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------------------------------------------------------- decision y costo */
const COST = DATA.cost_matrix;
const SPLITS = ["validation", "test"];
const MODES = ["raw", "recal"];
const K_MIN = 0.5, K_MAX = 100, EPS = 1e-12;
const kFromSlider = (s) => K_MIN * Math.pow(K_MAX / K_MIN, s / 1000);
const sliderFromK = (k) => Math.round((Math.log(k / K_MIN) / Math.log(K_MAX / K_MIN)) * 1000);

const PROB = {};
function probs(split, mode) {
  const key = split + "|" + mode;
  if (PROB[key]) return PROB[key];
  const src = DATA.pred[split].p, n = DATA.pred[split].y.length, out = new Float64Array(n * 5);
  for (let i = 0; i < out.length; i++) out[i] = src[i] / 1e6;
  if (mode === "recal") {
    // Platt ajustado en el OTRO conjunto: la misma funcion que src/models/calibration.py::apply_platt.
    const other = split === "test" ? "validation" : "test", a = DATA.platt[other].a, b = DATA.platt[other].b;
    for (let v = 0; v < n; v++) {
      const o = v * 5, risk = 1 - out[o], r = Math.min(1 - 1e-6, Math.max(1e-6, risk));
      const r2 = 1 / (1 + Math.exp(-(a * Math.log(r / (1 - r)) + b)));
      const scale = risk > EPS ? r2 / Math.max(risk, EPS) : 0;
      for (let k = 1; k < 5; k++) out[o + k] *= scale;
      out[o] = 1 - r2;
    }
  }
  return (PROB[key] = out);
}

function evaluate(split, k, mode = "raw") {
  const y = DATA.pred[split].y, p = probs(split, mode), n = y.length;
  const C = COST.map((row, i) => row.map((c, j) => (i === 0 && j > 0 ? c * k : c)));
  let policy = 0, nothing = 0, alarms = 0, fails = 0, caught = 0, healthy = 0, falseAlarms = 0;
  for (let v = 0; v < n; v++) {
    let best = 0, bestCost = Infinity;
    for (let a = 0; a < 5; a++) {
      let e = 0;
      for (let i = 0; i < 5; i++) e += p[v * 5 + i] * C[i][a];
      if (e < bestCost) { bestCost = e; best = a; }
    }
    const real = y[v];
    policy += C[real][best]; nothing += C[real][0];
    if (best > 0) alarms++;
    if (real > 0) { fails++; if (best > 0) caught++; } else { healthy++; if (best > 0) falseAlarms++; }
  }
  return { n, policy, nothing, alarms, fails, caught, healthy, falseAlarms, saving: 100 * (1 - policy / nothing) };
}

const GRID = Array.from({ length: 41 }, (_, i) => K_MIN * Math.pow(K_MAX / K_MIN, i / 40));
const curves = {};
function computeCurves() { SPLITS.forEach((s) => MODES.forEach((m) => { curves[s + "|" + m] = GRID.map((k) => evaluate(s, k, m).saving); })); }

// Mismo criterio que calibration.break_even: mayor k de una grilla de 301 puntos (x0,05 a x2000) donde el ahorro
// supera 1%. No depende del control, asi que se calcula una vez por (conjunto, modo).
const BE_THRESHOLD = 1.0, BE_GRID = Array.from({ length: 301 }, (_, i) => 0.05 * Math.pow(2000 / 0.05, i / 300)), BE_CACHE = {};
function breakEven(split, mode) {
  const key = split + "|" + mode;
  if (key in BE_CACHE) return BE_CACHE[key];
  let last = BE_GRID[0];
  for (const k of BE_GRID) if (evaluate(split, k, mode).saving > BE_THRESHOLD) last = k;
  return (BE_CACHE[key] = last >= BE_GRID[BE_GRID.length - 1] ? null : last);
}

/* ------------------------------------------------------------------- vistas */
const state = { split: "test", mode: "raw", k: 1 };

function renderTables() {
  const rows = COST.map((row, i) => {
    const cells = row.map((c, j) => `<td class="${i === j ? "diag" : ""} ${i === 0 ? "row0" : ""}">${c}</td>`).join("");
    return `<tr><td>${i === 0 ? "0 (" + t("cost_row0") + ")" : i}</td>${cells}</tr>`;
  }).join("");
  const heads = [0, 1, 2, 3, 4].map((j) => `<th>${t("cost_col")} ${j}</th>`).join("");
  $("tCost").innerHTML = `<thead><tr><th>${t("cost_row")}</th>${heads}</tr></thead><tbody>${rows}</tbody>`;
  const f = DATA.ttf;
  $("tTtf").innerHTML = `<thead><tr><th>${t("t_ttf_h1")}</th><th>${t("t_ttf_h2")}</th><th>${t("t_ttf_h3")}</th></tr></thead><tbody>` +
    `<tr><td>${t("ttf_all")}</td><td>${num(f.mae, 1)}</td><td>${num(f.mae_base, 1)}</td></tr>` +
    `<tr><td>${t("ttf_48")}</td><td>${num(f.mae48, 1)}</td><td>${num(f.mae48_base, 1)}</td></tr></tbody>`;
  const body = SPLITS.flatMap((s) => DATA.calibration[s].map((r) =>
    `<tr><td>${t("split_" + s)}</td><td>${num(r.desde * 100, 0)}–${num(r.hasta * 100, 0)}%</td><td>${num(r.n)}</td><td class="${r.predicho > 2 * r.observado ? "over" : ""}">${num(r.predicho * 100, 1)}%</td><td>${num(r.observado * 100, 1)}%</td></tr>`)).join("");
  $("tCal").innerHTML = `<thead><tr><th>${t("cal_split")}</th><th>${t("cal_range")}</th><th>${t("cal_n")}</th><th>${t("cal_pred")}</th><th>${t("cal_obs")}</th></tr></thead><tbody>${body}</tbody>`;
}

function textVars() {
  const k = DATA.key, c = DATA.cal_summary, p = (v) => num(v * 100, 1);
  return {
    n: num(k.n_val + k.n_test),
    pv: p(c.validation.pred), pt: p(c.test.pred), ov: p(c.validation.obs), ot: p(c.test.obs),
    hv: num(c.validation.top_obs * 100, 0), ht: num(c.test.top_obs * 100, 0),
    av: num(DATA.platt.validation.a, 2), at: num(DATA.platt.test.a, 2),
    sv: num(k.recal_saving_val, 0), st: num(k.recal_saving_test, 0), rv: num(k.saving_val, 0), rt: num(k.saving_test, 0),
    lo: num(Math.min(k.recal_saving_val, k.recal_saving_test, k.saving_val, k.saving_test), 0), hi: num(Math.max(k.recal_saving_val, k.recal_saving_test, k.saving_val, k.saving_test), 0),
    b1: num(Math.min(k.be_val, k.be_test, k.recal_be_val, k.recal_be_test), 1), b2: num(Math.max(k.be_val, k.be_test, k.recal_be_val, k.recal_be_test), 1),
    nv: k.fails_val, nt: k.fails_test, rvv: num(k.recall_val * 100, 0), rtt: num(k.recall_test * 100, 0),
  };
}

function renderStatic() {
  document.documentElement.lang = lang;
  const k = DATA.key, fl = textVars();
  document.querySelectorAll("[data-i18n]").forEach((e) => { const v = t(e.dataset.i18n); if (typeof v === "string") e.innerHTML = fill(v, fl); });
  $("tiles").innerHTML = [
    ["−" + num(k.saving_val, 0) + "%", t("n_val")], ["−" + num(k.saving_test, 0) + "%", t("n_test")],
    [num(k.auc_test, 2), t("n_auc")], ["×" + num(k.be_val, 1) + " / ×" + num(k.be_test, 1), t("n_be")],
  ].map((x) => `<div class="tile"><div class="n">${x[0]}</div><div class="l">${x[1]}</div></div>`).join("");
  $("limits").innerHTML = t("limits").map((x) => `<li>${fill(x, { ...fl, rv: fl.rvv, rt: fl.rtt })}</li>`).join("");
  $("calNote").textContent = fill(t("cal_note"), fl);
  document.querySelectorAll("figure img").forEach((img) => { img.alt = img.nextElementSibling ? img.nextElementSibling.textContent : ""; });
  $("lang").textContent = lang === "es" ? "EN" : "ES";
  document.title = t("h1");
  renderTables();
}

function renderResult() {
  const r = evaluate(state.split, state.k, state.mode);
  $("kOut").textContent = "×" + num(state.k, state.k < 10 ? 1 : 0);
  const pct = (a, b) => num((100 * a) / b, 0) + "%";
  $("result").innerHTML = [
    [num(r.policy), t("r_cost"), ""], [num(r.nothing), t("r_nothing"), ""],
    [num(r.saving, 1) + "%", t("r_saving"), r.saving > BE_THRESHOLD ? "good" : "bad"],
    [pct(r.alarms, r.n), t("r_alarm") + " (" + num(r.alarms) + " " + t("of") + " " + num(r.n) + ")", ""],
    [pct(r.caught, r.fails), t("r_caught") + " (" + num(r.caught) + " " + t("of") + " " + num(r.fails) + ")", ""],
    [num(r.falseAlarms), t("r_false") + " (" + t("of") + " " + num(r.healthy) + ")", ""],
  ].map((x) => `<div class="${x[2]}"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("");
  const be = breakEven(state.split, state.mode);
  const sp = t("split_" + state.split).toLowerCase(), md = t("mode_" + state.mode).toLowerCase();
  let first;
  if (r.saving > BE_THRESHOLD) first = fill(t("v_good"), { s: num(r.saving, 1) });
  else first = fill(t("v_zero"), { w: r.saving < -0.5 ? fill(t("v_worse"), { p: num(-r.saving, 0) }) : t("v_same") });
  const second = be == null ? fill(t("v_be_far"), { s: sp, m: md }) : fill(t("v_be"), { b: num(be, be < 10 ? 1 : 0), s: sp, m: md });
  $("verdict").innerHTML = first + " " + second;
}

function chipGroup(host, options, current, label, onPick) {
  host.innerHTML = "";
  options.forEach((o) => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = label(o); b.setAttribute("aria-pressed", current === o);
    b.onclick = () => onPick(o); host.appendChild(b);
  });
}
function renderChips() {
  chipGroup($("splitChips"), SPLITS, state.split, (s) => t("split_" + s), (s) => { state.split = s; renderChips(); renderResult(); });
  chipGroup($("modeChips"), MODES, state.mode, (m) => t("mode_" + m), (m) => { state.mode = m; renderChips(); renderResult(); });
}

/* ---------------------------------------------------------- grafico de curva */
function renderCurve() {
  const host = $("plot"); host.innerHTML = "";
  const W = Math.max(300, Math.round(host.clientWidth) || 900), H = W < 560 ? 300 : 360, m = { l: 46, r: 12, t: 26, b: 44 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  // Piso del eje en -100%: la curva de validacion sin recalibrar cae hasta ~-590% y aplastaria la zona que importa.
  // Lo que baja mas se recorta y se declara en una nota debajo del grafico.
  const FLOOR = -100;
  const lo = FLOOR, hi = Math.ceil(Math.max(...Object.values(curves).flat()) / 20) * 20, stepY = 20;
  const X = (k) => m.l + (Math.log(k / K_MIN) / Math.log(K_MAX / K_MIN)) * iw;
  const Y = (v) => m.t + ih - ((Math.max(lo, v) - lo) / (hi - lo)) * ih;
  const colors = { validation: css("--s1"), test: css("--s2") };
  const series = SPLITS.flatMap((s) => MODES.map((md) => ({ s, md, key: s + "|" + md, color: colors[s], dash: md === "recal" ? "6 4" : "none", label: t("series_" + s + "_" + md) })));
  const clipped = series.map((sr) => ({ sr, min: Math.min(...curves[sr.key]) })).filter((x) => x.min < FLOOR);
  $("clipNote").textContent = clipped.length ? fill(t("clip_note"), { list: clipped.map((x) => x.sr.label + ": " + num(x.min, 0) + "%").join("; ") }) : "";
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("role", "img"); svg.setAttribute("tabindex", "0"); svg.setAttribute("aria-label", t("c_title")); host.appendChild(svg);
  const el = (tag, attrs, text) => { const e = document.createElementNS(ns, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; svg.appendChild(e); return e; };
  for (let v = lo; v <= hi; v += stepY) { el("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: v === 0 ? css("--ink-2") : css("--line"), "stroke-width": v === 0 ? 1.2 : 1 }); el("text", { x: m.l - 8, y: Y(v) + 4, "text-anchor": "end", "font-size": 11, fill: css("--ink-2") }, num(v, 0)); }
  [0.5, 1, 3, 10, 30, 100].forEach((k) => { el("text", { x: X(k), y: H - 24, "text-anchor": "middle", "font-size": 11, fill: css("--ink-2") }, "×" + num(k, k < 1 ? 1 : 0)); });
  el("text", { x: m.l + iw / 2, y: H - 6, "text-anchor": "middle", "font-size": 11, fill: css("--ink-2") }, t("curve_x"));
  el("text", { x: 4, y: 12, "font-size": 11, fill: css("--ink-2") }, t("curve_saving"));
  series.forEach((sr) => {
    const d = GRID.map((k, i) => (i ? "L" : "M") + X(k).toFixed(1) + " " + Y(curves[sr.key][i]).toFixed(1)).join("");
    el("path", { d, fill: "none", stroke: sr.color, "stroke-width": sr.md === "raw" ? 2.4 : 2, "stroke-dasharray": sr.dash, "stroke-linejoin": "round", "stroke-linecap": "round" });
  });
  const guide = el("line", { y1: m.t, y2: m.t + ih, stroke: css("--ink"), "stroke-width": 1.2, "stroke-dasharray": "2 3" });
  const dots = series.map((sr) => el("circle", { r: 4.5, fill: sr.md === "raw" ? sr.color : css("--surface"), stroke: sr.color, "stroke-width": 2 }));
  const tip = document.createElement("div"); tip.className = "tip"; tip.style.display = "none"; host.appendChild(tip);
  function place() {
    const x = X(state.k); guide.setAttribute("x1", x); guide.setAttribute("x2", x);
    series.forEach((sr, i) => { dots[i].setAttribute("cx", x); dots[i].setAttribute("cy", Y(evaluate(sr.s, state.k, sr.md).saving)); });
  }
  place();
  const kAt = (ev) => { const r = svg.getBoundingClientRect(); const px = ((ev.clientX - r.left) / r.width) * W; return Math.max(K_MIN, Math.min(K_MAX, K_MIN * Math.pow(K_MAX / K_MIN, (px - m.l) / iw))); };
  function setK(k) { state.k = k; $("k").value = sliderFromK(k); renderResult(); place(); }
  function hover(ev) {
    const k = kAt(ev); let h = `<div style="color:var(--ink-2);margin-bottom:3px">${t("col_k")}${num(k, k < 10 ? 1 : 0)}</div>`;
    series.forEach((sr) => { h += `<div><span class="sw${sr.md === "recal" ? " dash" : ""}" style="background:${sr.color};border-color:${sr.color}"></span>${sr.label}: <b>${num(evaluate(sr.s, k, sr.md).saving, 1)}%</b></div>`; });
    tip.innerHTML = h; tip.style.display = "block";
    const px = (X(k) / W) * host.clientWidth, w = tip.offsetWidth; tip.style.left = Math.max(w / 2, Math.min(host.clientWidth - w / 2, px)) + "px"; tip.style.top = "8px";
  }
  svg.addEventListener("pointermove", hover); svg.addEventListener("pointerleave", () => { tip.style.display = "none"; });
  svg.addEventListener("pointerdown", (ev) => { setK(kAt(ev)); hover(ev); });
  svg.addEventListener("keydown", (ev) => {
    const s = Math.round(sliderFromK(state.k)); let ns2 = null;
    if (ev.key === "ArrowLeft") ns2 = s - 20; else if (ev.key === "ArrowRight") ns2 = s + 20; else if (ev.key === "Home") ns2 = 0; else if (ev.key === "End") ns2 = 1000;
    if (ns2 != null) { setK(kFromSlider(Math.max(0, Math.min(1000, ns2)))); ev.preventDefault(); }
  });
  $("legend").innerHTML = series.map((sr) => `<span><span class="sw${sr.md === "recal" ? " dash" : ""}" style="background:${sr.color};border-color:${sr.color}"></span>${sr.label}</span>`).join("");
}

function renderAll() { renderStatic(); renderChips(); renderResult(); renderCurve(); }

$("k").oninput = () => { state.k = kFromSlider(+$("k").value); renderResult(); renderCurve(); };
$("lang").onclick = () => { lang = lang === "es" ? "en" : "es"; try { localStorage.setItem("lang", lang); } catch (e) {} renderAll(); };
$("theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch (e) {}
  renderAll();
};
try { const th = localStorage.getItem("theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
{ const q = new URLSearchParams(location.search).get("theme"); if (q === "light" || q === "dark") document.documentElement.dataset.theme = q; }
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderAll);
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(renderCurve, 150); });

computeCurves();
$("k").value = sliderFromK(state.k);
renderAll();
</script>
</body>
